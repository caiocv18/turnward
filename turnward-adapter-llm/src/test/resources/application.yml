resilience4j:
  circuitbreaker:
    instances:
      smoke:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1m
        automatic-transition-from-open-to-half-open-enabled: false
